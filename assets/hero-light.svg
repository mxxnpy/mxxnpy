.moon .row { fill: #8a5f12; animation: rise .9s cubic-bezier(.16,1,.3,1) backwards; }
.moon .star { fill: #9b916f; animation: twinkle 4s ease-in-out infinite; }
.moon { filter: drop-shadow(0 0 6px #d9b25c55); }
.label { fill: #6e7386; font-size: 13px; letter-spacing: .14em; }
