name: Spotify Update
on:
  schedule:
    - cron: "*/5 * * * *"  # Mínimo do GitHub; na prática ele atrasa bastante
  workflow_dispatch:  # Permite execução manual
  push:
    paths:
      - 'spotify_tracker.py'
      - 'spotify_update.py'
      - 'brand.py'

concurrency:
  group: readme-svg
  cancel-in-progress: false

jobs:
  update-spotify:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          
      - name: Configure pip cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-
          
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
        
      - name: Update Spotify only
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
        run: python spotify_update.py
        
      # O card vive num branch órfão de um único commit, para não encher o histórico do main
      - name: Publish card to the output branch
        run: |-
          mkdir -p /tmp/card && cp assets/now-playing-*.svg /tmp/card/
          git config user.email "github-actions-bot@mxxnpy.github.io"
          git config user.name "mxxnpy/Spotify-Bot"
          git checkout -q --orphan output
          git rm -rq --cached .
          git clean -fdxq
          cp /tmp/card/*.svg .
          git add now-playing-*.svg
          git commit -qm "🎵 Now playing"
          git push -f origin output
